<app-header/>

<main>
    <ul id="users">
        @for (user of users; track user.id) {
            <li>
                <app-user 
                    [selected]="user.id === selectedUserId"
                    [user]="user"
                    (select)="onSelectedUser($event)" />
            </li>
        }
    </ul>
    @if (selectedUser) {
        <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name"/>
    }@else{
        <p>Select a user to see the task!</p>
    }
</main>
